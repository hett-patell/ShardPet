<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ShardPet</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #141414;
        --muted: #6b6b6b;
        --border: #e8e8e8;
        --surface: #f3f3f4;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --radius: 10px;
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121214;
          --fg: #ececf0;
          --muted: #9898a0;
          --border: #2a2a30;
          --surface: #1c1c20;
          --accent: #60a5fa;
          --accent-soft: rgba(96, 165, 250, 0.15);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        font: 12px/1.45 var(--font);
        width: 300px;
        max-height: min(560px, 92vh);
        overflow-x: hidden;
        overflow-y: auto;
        background: var(--bg);
        color: var(--fg);
        padding: 12px 12px 14px;
      }

      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .ver {
        font-size: 10px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 10px 8px;
        margin-bottom: 8px;
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row:last-child {
        margin-bottom: 0;
      }

      .row input[type="checkbox"] {
        margin-top: 2px;
        accent-color: var(--accent);
      }

      .row label {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        line-height: 1.35;
      }

      .field label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        margin: 6px 0 3px;
      }

      .field label:first-of-type {
        margin-top: 0;
      }

      label output {
        font-weight: 600;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        display: block;
        width: 100%;
        height: 4px;
        margin: 0 0 2px;
        accent-color: var(--accent);
      }

      select {
        width: 100%;
        padding: 5px 7px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
      }

      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      details {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 8px;
        background: transparent;
      }

      details[open] {
        background: var(--surface);
      }

      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        list-style: none;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 10px;
        user-select: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::after {
        content: "";
        flex-shrink: 0;
        width: 5px;
        height: 5px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        margin-top: 4px;
        opacity: 0.7;
      }

      details[open] summary::after {
        transform: rotate(45deg);
        margin-top: 6px;
      }

      .panel {
        padding: 0 10px 10px;
      }

      textarea {
        width: 100%;
        min-height: 48px;
        font: 10px/1.35 var(--mono);
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        resize: vertical;
        outline: none;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .panel .field label {
        margin-top: 8px;
      }

      .panel .field label:first-of-type {
        margin-top: 0;
      }

      .actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      .btn {
        flex: 1;
        padding: 6px 8px;
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }

      .btn:hover {
        background: var(--surface);
      }

      .btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--accent-soft);
        border-color: var(--accent);
      }

      .status {
        margin-top: 8px;
        font-size: 10px;
        color: var(--muted);
        min-height: 13px;
        line-height: 1.35;
      }

      .footer {
        margin-top: 10px;
        font-size: 9px;
        color: var(--muted);
        line-height: 1.4;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1 class="title">ShardPet</h1>
      <span class="ver" id="version-label">v1.0</span>
    </header>

    <div class="card">
      <div class="row">
        <input type="checkbox" id="enabled" />
        <label for="enabled">Show pets on pages</label>
      </div>

      <div class="field">
        <label for="count">Count <output id="count-out"></output></label>
        <input type="range" id="count" min="1" max="3" step="1" />

        <label for="size">Size <output id="size-out"></output></label>
        <input type="range" id="size" min="24" max="128" step="2" />

        <label for="offset">Offset <output id="offset-out"></output></label>
        <input type="range" id="offset" min="0" max="40" step="1" />
      </div>

      <div class="grid-2" style="margin-top: 4px">
        <div class="field" style="margin: 0">
          <label for="speed">Speed</label>
          <select id="speed">
            <option value="slow">Slow</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="field" style="margin: 0">
          <label for="reduced">Motion</label>
          <select id="reduced">
            <option value="auto">Auto</option>
            <option value="off">Off</option>
            <option value="on">On</option>
          </select>
        </div>
      </div>
    </div>

    <details>
      <summary>Sites</summary>
      <div class="panel">
        <div class="field">
          <label for="blacklist">Blacklist</label>
          <textarea id="blacklist" placeholder="one host per line"></textarea>
        </div>
        <div class="field">
          <label for="favorites">Favorites (IDs)</label>
          <textarea id="favorites" placeholder="25&#10;143" rows="2"></textarea>
        </div>
      </div>
    </details>

    <details>
      <summary>Focus</summary>
      <div class="panel">
        <div class="row" style="margin-bottom: 8px">
          <input type="checkbox" id="nag-enabled" />
          <label for="nag-enabled">“Get back to work” overlay</label>
        </div>
        <div class="field">
          <label for="threshold">After <output id="threshold-out"></output></label>
          <input type="range" id="threshold" min="1" max="60" step="1" />
        </div>
        <div class="field">
          <label for="allowlist">Allowlist</label>
          <textarea id="allowlist" placeholder="one host per line"></textarea>
        </div>
        <div class="row" style="margin-top: 8px; margin-bottom: 0">
          <input type="checkbox" id="indicator" />
          <label for="indicator">Timer pill (top-right)</label>
        </div>
      </div>
    </details>

    <div class="actions">
      <button class="btn" id="resync" type="button">Resync</button>
      <button class="btn" id="reset-timers" type="button">Reset timers</button>
    </div>
    <span class="status" id="status"></span>

    <p class="footer">
      Sprites © Nintendo / Game Freak / Creatures — fetched from PokéAPI; not bundled here.
    </p>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
